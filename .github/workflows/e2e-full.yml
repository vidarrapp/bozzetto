# The whole browser suite, every suite in tests/e2e: about 50 minutes on
# a fast machine, so weekly and from the Actions tab rather than on every
# push (ci.yml runs a few of its suites there).
name: E2E (full)

on:
  workflow_dispatch:
  schedule:
    # Mondays, early morning UTC.
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # As in ci.yml: Playwright for this checkout only, with its Chromium.
      - name: Playwright and Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: npm run gen:sample
      - run: npm run build:test
      - name: Every suite
        run: node tests/e2e/run.mjs
