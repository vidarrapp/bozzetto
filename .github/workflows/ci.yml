# Checks on every push and every pull request: both typechecks and the
# production build, the Functions against the local Workers runtime, and a
# few of the browser suites, the accounts suite among them. The whole
# browser suite (about 50 minutes) is e2e-full.yml, weekly and on demand.
#
# A read-only token, no install scripts, and no pull_request_target: a
# pull request from a fork runs here with nothing worth taking.
name: CI

on:
  # Every branch; a release tag's commit was already checked on its branch.
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer push to the same branch, or pull request, replaces the run still
# going for the one before.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run typecheck:functions
      # What Cloudflare Pages runs (prebuild included).
      - run: npm run build

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # wrangler pages dev over workerd, D1 and R2 simulated on disk.
      - run: npm run check:functions

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Playwright is not a dependency of the app (tests/e2e/lib.mjs takes
      # whichever one it can reach). Add it to this checkout only, at a
      # fixed version, with its Chromium and the libraries that needs.
      - name: Playwright and Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      # build:test has no prebuild hook: make the generated demo assets
      # first, as npm run build does.
      - run: npm run gen:sample
      - run: npm run build:test
      # Fast suites only: boot, the primitives, the gallery's Create menu,
      # and a scene file's round trip.
      - name: Smoke suites
        timeout-minutes: 10
        run: node tests/e2e/run.mjs boot primitives gallery roundtrip
      # Sign-in, Join, Account, My projects, the owner's tools and Delete
      # account, against the real Functions: the suite starts `wrangler
      # pages dev` over dist/ itself, in a throwaway project with
      # node_modules linked in and a local D1 (tests/e2e/lib.mjs
      # startAccountsServer), with a stand-in for Turnstile's siteverify
      # (tests/functions/turnstile-fake.mjs) and codes read from the dev
      # outbox. Two to five minutes, wrangler's start included.
      - name: Accounts suite
        timeout-minutes: 15
        run: node tests/e2e/run.mjs accounts
