# Desktop releases.
#
# This builds Bozzetto on all three platforms, attaches the installers to
# a GitHub Release, and publishes it once all three are on it. macOS is
# the reason it is a matrix at all: Apple's tooling cannot be cross-run,
# so the .dmg has to be built on a mac. Linux and Windows could share a
# runner, but building each on its own platform is what the installers
# are tested against.
#
# Two ways to release, both ending in the same published release:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# or run it from the Actions tab with the version filled in, and the
# workflow tags main itself. Run it there with the version left empty to
# test the build: that path publishes nothing and leaves the installers
# as artifacts.
name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Version to release (e.g. 0.1.0; must match package.json). Leave empty for a test build.'
        required: false
        default: ''

# The release is created, uploaded to, and published with this token.
permissions:
  contents: write

jobs:
  # A release opens its draft first, so the three builders find one
  # release to upload to instead of racing to create three. Skipped on a
  # test build, which publishes nothing.
  draft:
    if: github.event_name == 'push' || inputs.release != ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.open.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag, and open the draft release
        id: open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          set -e
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then tag="$GITHUB_REF_NAME"; else tag="v$RELEASE_INPUT"; fi
          # electron-builder names the files and looks the release up by
          # package.json's version, so a tag that says otherwise would
          # upload to a release nobody asked for.
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "v$version" ]; then
            echo "::error::$tag does not match package.json version $version"
            exit 1
          fi
          # From the Actions tab there is no tag yet: make one at this commit.
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
              echo "tagged $GITHUB_SHA as $tag"
            fi
          fi
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq "map(select(.tag_name == \"$tag\")) | length")
          if [ "$existing" = "0" ]; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --title "Bozzetto $tag" --generate-notes
          else
            echo "a release for $tag already exists; uploading to it"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    # A test build skips the draft job; the build must still happen.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      # One platform failing should not throw away the two that worked.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage
          - os: windows-latest
            target: --win nsis
          # One app for Apple Silicon and Intel alike. Twice the Electron
          # binary inside, and no second download for anyone to pick wrong.
          - os: macos-latest
            target: --mac dmg zip --universal
    runs-on: ${{ matrix.os }}

    # Action majors built for Node 24: the runners have deprecated the
    # Node 20 runtime and annotate every step that still targets it.
    # (upload-artifact's v5 still declares node20; v6 is the node24 one.)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The build's own Node. 20 reached end of life in April 2026;
          # 22 is what the desktop build is verified on.
          node-version: 22
          cache: npm

      - run: npm ci

      # electron-builder packages dist-desktop; it does not build it. This
      # step is what makes dist-desktop exist on a fresh runner - without
      # it the files glob matches nothing and every platform ships an app
      # with no web content in it.
      - name: Build the web app for the desktop shell
        run: npm run build:desktop

      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish ${{ needs.draft.result == 'success' && 'always' || 'never' }}
        env:
          # The token electron-builder uses to upload to the draft release.
          # Provided by Actions; no secret to configure.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this, a mac runner with no certificate installed still
          # tries to discover one and fails the build rather than producing
          # an unsigned app. Remove it once a Developer ID is in place.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Test builds publish nothing, so keep the output reachable.
      - name: Upload installers
        if: needs.draft.result == 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: bozzetto-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  # All three builders succeeded (a failed one leaves the draft as it is,
  # for a person to look at): check the installers are all on the release,
  # then publish it. The site's Install card reads the latest published
  # release, so this is the moment the downloads go live.
  publish:
    needs: [draft, build]
    if: needs.draft.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq "map(select(.tag_name == \"$TAG\"))[0]")
          id=$(echo "$release" | jq -r .id)
          names=$(echo "$release" | jq -r '.assets[].name')
          echo "$names"
          for ext in .dmg .exe .AppImage; do
            echo "$names" | grep -q "$ext\$" || { echo "no $ext on the release; leaving it a draft"; exit 1; }
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -f make_latest=true --jq .html_url
